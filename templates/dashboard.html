<!doctype html>
<!--
  템플릿: 대시보드 (templates/dashboard.html) — vault/patterns/dashboard.html의 뼈대, 데이터 슬롯은 비워 둠

  언제 쓰나
    숫자를 매일 들여다보는 화면. 지표 몇 개로 "지금 상태"를 먼저 보여 주고, 차트로 추이를,
    표로 개별 항목을 본다. 예: 포트폴리오, 매출·상권 현황, 서비스 운영 지표.

  구조 (위 → 아래)
    1. 상단 바 (.topbar) — 로고 자리 · 주 메뉴 · 오른쪽 액션(테마·알림·계정)
    2. 요약 (.summary, 간격 --sp-4) — 페이지 머리(기준시점 + 제목 + 페이지 행동) → KPI 줄 → 경고
       KPI 줄 (.kpis) — 4칸 Stat. 첫 칸(.stat-lead)이 화면에서 가장 큰 숫자. 변화량은 기준 + 등락(등락 부분만 .up/.down)
    3. 주 차트 + 보조 패널 (.main-grid) — 2:1. 기간 세그먼트는 차트 패널 머리에(차트에만 적용)
    4. 표 (.table) — 머리에 칩 필터 + 적용 개수 + 초기화(표에만 적용). 숫자 열 우측 정렬, 단위는 헤더로
    덩어리 사이(요약 → 추이 → 표)는 --sp-10. 필터는 적용되는 대상의 머리에 둔다

  반응형 규칙
    - 1024px 이하: 차트와 보조 패널이 세로로 쌓인다
    - 640px 이하: KPI 4칸 → 2칸(Design.md §7), 메뉴 → 햄버거, 기간 세그먼트는 한 줄을 꽉 채우고
      칩 줄은 가로 스크롤, 표는 래퍼 안에서 가로 스크롤(tabindex=0으로 키보드 스크롤 가능)
    - 터치 타깃 40px(--hit-min)

  슬롯은 "슬롯:"으로 시작하는 HTML 주석으로 표시했다. 채운 뒤 scripts/check.sh · scripts/shot.sh로 검증.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---------- 공통 (components.html에서 포크) ---------- */
  [hidden] { display: none !important; } /* .badge·.empty 같은 display 규칙이 hidden 속성을 이기지 않게 */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ic-16 { width: 16px; height: 16px; }
  .btn-icon { width: var(--hit-min); padding: 0; }
  .cap { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }
  .flat { color: var(--text-2); }

  .topbar { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--sp-6); height: var(--topbar-h); padding: 0 var(--gutter); background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { display: inline-flex; align-self: stretch; align-items: center; gap: var(--sp-2); color: var(--text); font-weight: 700; text-decoration: none; white-space: nowrap; }
  .brand:hover { color: var(--text); }
  .brand-mark { width: 24px; height: 24px; border-radius: var(--r-sm); background: var(--text); }
  .topnav { display: flex; align-self: stretch; gap: var(--sp-1); }
  .topnav a { display: inline-flex; align-items: center; padding: 0 var(--sp-3); color: var(--text-2); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .topnav a:hover { color: var(--text); }
  .topnav a[aria-current="page"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .topbar-actions { display: flex; align-items: center; gap: var(--sp-1); margin-left: auto; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; }
  .hamburger { display: none; }
  .mobile-menu { position: sticky; top: var(--topbar-h); z-index: var(--z-sticky); display: grid; padding: var(--sp-2); background: var(--surface); border-bottom: 1px solid var(--border); }
  .mobile-menu[hidden] { display: none; }
  .mobile-menu a { display: flex; align-items: center; min-height: var(--hit-min); padding: 0 var(--sp-3); border-radius: var(--r-md); color: var(--text); text-decoration: none; font-size: var(--fs-sm); }
  .mobile-menu a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
  @media (max-width: 640px) { .topnav { display: none; } .hamburger { display: inline-flex; } .topbar { gap: var(--sp-2); } }
  @media (min-width: 641px) { .mobile-menu { display: none !important; } }

  .menu-wrap { position: relative; display: inline-block; }
  .menu { position: absolute; top: calc(100% + var(--sp-1)); right: 0; z-index: var(--z-dropdown); min-width: 200px; padding: var(--sp-1); display: grid; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-pop); }
  .menu[hidden] { display: none; }
  .menu-item { display: flex; align-items: center; gap: var(--sp-2); min-height: var(--hit-min); padding: 0 var(--sp-3); background: none; border: 0; border-radius: var(--r-sm); color: var(--text); font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer; }
  .menu-item:hover, .menu-item:focus { background: var(--surface-2); outline: none; }
  .menu-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3) var(--sp-4); }
  .panel-head .seg { margin-left: auto; }
  .chips { display: flex; gap: var(--sp-2); }
  .chip-btn { display: inline-flex; align-items: center; gap: var(--sp-1); height: 32px; padding: 0 var(--sp-3); background: var(--surface); color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--r-full); font: inherit; font-size: var(--fs-sm); white-space: nowrap; cursor: pointer; }
  .chip-btn:hover { background: var(--surface-2); color: var(--text); }
  .chip-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
  .chip-btn .ic { display: none; }
  .chip-btn[aria-pressed="true"] .ic { display: block; }
  .filter-end { display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; }
  .seg { display: inline-flex; width: fit-content; margin: 0; padding: 0; min-width: 0; border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .seg label { position: relative; display: flex; }
  .seg label + label { border-left: 1px solid var(--border); }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: inline-flex; align-items: center; justify-content: center; flex: 1; height: 32px; padding: 0 var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); white-space: nowrap; }
  .seg label:hover span { background: var(--surface-2); color: var(--text); }
  .seg input:checked + span { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (max-width: 640px), (pointer: coarse) { .chip-btn, .seg span { height: var(--hit-min); } }
  @media (max-width: 640px) {
    .filter-bar .chips { order: 2; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); }
    .filter-bar .chips::-webkit-scrollbar { display: none; }
    .panel-head .seg { display: flex; flex-basis: 100%; margin-left: 0; }
    .panel-head .seg label { flex: 1; }
    .filter-end { order: 3; margin-left: 0; }
  }

  .banner { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); }
  .banner > .ic { margin-top: var(--sp-1); color: var(--text-2); }
  .banner-text { flex: 1; display: grid; gap: var(--sp-1); padding-top: var(--sp-1); }
  .banner-text strong { font-weight: 600; }
  .banner-text p { color: var(--text-2); }
  .banner-warning { background: var(--warning-soft); } .banner-warning > .ic { color: var(--warning); }

  /* ---------- 이 패턴 ---------- */
  /* 간격 그룹: 요약(머리·KPI·경고)은 붙이고, 요약 → 추이(차트) → 종목(표) 사이는 벌린다 (Design.md §4) */
  main.container { padding-block: var(--sp-8) var(--sp-20); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-10); }
  .summary { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-3) var(--sp-4); }
  .page-head .cap { margin-bottom: var(--sp-1); }
  /* 화면의 주인공은 첫 KPI 값: 제목은 한 단계 낮추고(조밀 단계 §3) 첫 KPI(.stat-lead) 값을 가장 크게 */
  .page-head h1 { font-size: var(--fs-d-xl); line-height: var(--lh-d-xl); }

  /* KPI 칸마다 라벨·값·변화량·스파크라인 줄을 subgrid로 공유해 기준선을 맞춘다 */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, auto); gap: 0 var(--sp-6); padding: var(--sp-6); }
  .kpis .stat { min-width: 0; grid-row: span 4; grid-template-rows: subgrid; row-gap: var(--sp-1); align-content: start; }
  .kpis .stat-value { align-self: last baseline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-d-lg); line-height: var(--lh-d-lg); }
  .kpis .stat-lead .stat-value { font-size: var(--fs-d-2xl); line-height: var(--lh-d-2xl); font-weight: 700; }
  .kpis .stat-delta { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }
  .kpis .stat-delta :is(.up, .down) { white-space: nowrap; } /* ▲와 숫자가 줄바꿈으로 갈라지지 않게 */
  .spark { display: block; width: 100%; max-width: 160px; height: 24px; margin-top: var(--sp-1); overflow: visible; }
  @media (max-width: 1024px) {
    .page-head h1 { font-size: var(--fs-d-lg); line-height: var(--lh-d-lg); }
    .kpis .stat-value { font-size: var(--fs-h3); line-height: var(--lh-h3); }
    .kpis .stat-lead .stat-value { font-size: var(--fs-d-xl); line-height: var(--lh-d-xl); }
  }
  /* 640px 이하: 2칸으로 접고(§7), 첫 KPI는 한 줄을 다 써서 가장 크게 둔다 */
  @media (max-width: 640px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; gap: var(--sp-5) var(--sp-4); padding: var(--sp-4); }
    .kpis .stat-lead { grid-column: 1 / -1; }
    .kpis .stat-lead .stat-value { font-size: var(--fs-d-2xl); line-height: var(--lh-d-2xl); }
  }

  .main-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--sp-4); }
  @media (max-width: 1024px) { .main-grid { grid-template-columns: minmax(0, 1fr); } }
  .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--sp-1) var(--sp-4); margin-bottom: var(--sp-4); }
  .panel-head:has(.seg) { align-items: center; gap: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3); }
  .chart-legend { margin-bottom: var(--sp-3); }
  .panel-head h2 { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 600; }
  @media (max-width: 640px) { .panel { padding: var(--sp-4); } }

  .legend { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); font-size: var(--fs-xs); color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .key-line { width: 14px; height: 2px; border-radius: var(--chart-key-r); flex: none; }
  .chart { position: relative; width: 100%; height: 240px; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .chart text { font-family: var(--font-sans); font-size: var(--fs-xs); fill: var(--text-2); font-variant-numeric: tabular-nums; }
  .chart .val { fill: var(--text); font-weight: 600; }

  .alloc { display: grid; gap: var(--sp-4); margin: 0; padding: 0; list-style: none; }
  .alloc li { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-sm); }
  .alloc .bar { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: var(--r-full); overflow: hidden; }
  .alloc .bar i { display: block; height: 100%; background: var(--series-1); border-radius: var(--r-full); }
  .alloc .num { color: var(--text-2); }
  .alloc-total { display: flex; justify-content: space-between; padding-top: var(--sp-3); margin-top: var(--sp-4); border-top: 1px solid var(--border); font-size: var(--fs-sm); }

  .table-wrap { overflow-x: auto; }
  .table-wrap:focus-visible { outline-offset: -2px; }
  .holdings { min-width: 640px; }
  .holdings th.r { text-align: right; }
  .tk { color: var(--text); font-weight: 600; text-decoration: none; }
  .tk:hover { color: var(--accent); text-decoration: underline; }
  .code { display: block; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .holdings td { padding-block: var(--sp-2); }
  .holdings tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--border-strong); }
  .empty { margin-top: var(--sp-2); }
  /* 열이 5개를 넘는 표는 640px 이하에서 카드형 목록으로 (Design.md §6 Table). 라벨은 JS가 th에서 복사해 data-label로 */
  @media (max-width: 640px) {
    .table-cards { min-width: 0; }
    .table-cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .table-cards tbody tr, .table-cards tfoot tr { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2) var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--border); }
    .table-cards td { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); height: auto; padding: 0; border: 0; }
    .table-cards td::before { content: attr(data-label); font-size: var(--fs-xs); font-weight: 400; color: var(--text-2); }
    .table-cards td:first-child { grid-column: 1 / -1; display: block; }
    .table-cards td:first-child::before, .table-cards td:empty { display: none; }
    .table-cards tfoot td { border: 0; }
    .table-cards tbody tr:hover { background: none; }
  }
  /* 표 머리: 제목·개수 줄 + 이 표에만 적용되는 칩 필터 줄 */
  .table-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-3); }
  .table-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-2) var(--sp-3); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="#"><span class="brand-mark" aria-hidden="true"></span>{{TITLE}}</a>
  <nav class="topnav" aria-label="주 메뉴">
    <a href="#" aria-current="page">대시보드</a><a href="#">메뉴 2</a><a href="#">메뉴 3</a>
  </nav>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-icon" type="button" id="theme" aria-label="다크 모드로 보기"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
    <button class="btn btn-ghost btn-icon" type="button" aria-label="알림 3개"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg></button>
        <button class="btn btn-ghost btn-icon hamburger" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mMenu" id="hamburger"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
  </div>
</header>
<nav class="mobile-menu" id="mMenu" aria-label="주 메뉴(모바일)" hidden>
  <a href="#" aria-current="page">대시보드</a><a href="#">메뉴 2</a><a href="#">메뉴 3</a>
</nav>

<main class="container">
  <!-- 요약 묶음(.summary, 간격 --sp-4): 머리 → KPI → 경고. 덩어리 사이(요약 → 차트 → 표)는 --sp-10 -->
  <div class="summary">
  <!-- 슬롯: 첫 줄은 데이터 기준시점 + 가장 중요한 숫자 (Design.md §6 대시보드 화면). 환영 문구 금지 -->
  <div class="page-head">
    <div>
      <p class="cap">{{DATE}} 기준</p>
      <h1>{{TITLE}}</h1>
      <p class="muted" style="font-size:var(--fs-sm)">{{DESC}}</p>
    </div>
    <!-- 슬롯: 페이지 행동(내보내기 등). primary는 화면당 1개 -->
  </div>

  <!-- 슬롯: KPI 4칸 (640px 이하 2칸, 첫 칸은 한 줄 전체). 첫 칸(.stat-lead)이 화면에서 가장 큰 숫자.
       변화량은 기준을 앞에 쓰고 등락 부분만 색: 오늘 <span class="up">▲ +0.92%</span> — 기준 글자는 --text-2 그대로.
       시장 데이터는 .up/.down, 그 외는 색 없이 부호 또는 .good/.bad.
       시간에 따라 변하는 헤드라인 숫자에는 변화량 아래 스파크라인(<svg class="spark">) -->
  <section class="panel kpis" aria-label="핵심 지표">
    <div class="stat stat-lead" data-slot="kpi-1">
      <span class="stat-label">가장 중요한 숫자</span>
      <span class="stat-value">–</span>
      <span class="stat-delta">비교 기준 + 변화량</span>
    </div>
    <div class="stat" data-slot="kpi-2">
      <span class="stat-label">두 번째 지표</span>
      <span class="stat-value">–</span>
      <span class="stat-delta">비교 기준 + 변화량</span>
    </div>
    <div class="stat" data-slot="kpi-3">
      <span class="stat-label">세 번째 지표</span>
      <span class="stat-value">–</span>
      <span class="stat-delta">비교 기준 + 변화량</span>
    </div>
    <div class="stat" data-slot="kpi-4">
      <span class="stat-label">네 번째 지표</span>
      <span class="stat-value">–</span>
      <span class="stat-delta">비교 기준 + 변화량</span>
    </div>
  </section>

  <!-- 슬롯: 보여 줄 가치가 있는 상태 하나 — 경고·늦게 들어온 데이터 (.banner .banner-warning). 목업에 최소 하나 -->
  </div>

  <div class="main-grid">
    <section class="panel" aria-labelledby="chartTitle">
      <!-- 기간 세그먼트는 차트에만 적용되므로 차트 패널 머리에 둔다 -->
      <div class="panel-head">
        <h2 id="chartTitle">주 차트 제목</h2>
        <fieldset class="seg" id="period">
          <legend>차트 기간</legend>
          <label><input type="radio" name="period" value="1w"><span>1주</span></label>
          <label><input type="radio" name="period" value="1m"><span>1개월</span></label>
          <label><input type="radio" name="period" value="3m" checked><span>3개월</span></label>
          <label><input type="radio" name="period" value="1y"><span>1년</span></label>
          <label><input type="radio" name="period" value="all"><span>전체</span></label>
        </fieldset>
      </div>
      <div class="legend chart-legend"><!-- 계열 2개 이상이면 범례: <span><i class="key-line" style="background:var(--series-1)"></i>계열 이름</span> --></div>
      <!-- 슬롯: 차트. vault/charts.html의 선 차트를 포크. 형태는 Design.md §9로 먼저 고른다 -->
      <div class="chart" id="chart" role="img" aria-label="차트 설명"><div class="skeleton" style="height:100%"></div></div>
    </section>
    <section class="panel" aria-labelledby="sideTitle">
      <div class="panel-head"><h2 id="sideTitle">보조 패널</h2></div>
      <!-- 슬롯: 구성비 막대(.alloc) 또는 최근 알림 목록 -->
    </section>
  </div>

  <section>
    <!-- 칩 필터·초기화는 표에만 적용되므로 표 머리에 둔다 -->
    <div class="table-head">
      <div class="table-meta">
        <h2 id="tableTitle" style="font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:600">표 제목</h2>
        <span class="cap" id="tableCount" aria-live="polite"></span>
      </div>
      <div class="filter-bar" id="fb">
        <div class="chips" role="group" aria-label="표 거르기">
          <!-- 슬롯: <button class="chip-btn" type="button" aria-pressed="false"><svg class="ic ic-16" aria-hidden="true"><use href="#i-check"/></svg>구분 이름</button> -->
        </div>
        <div class="filter-end">
          <span class="badge badge-accent" id="fbCount" hidden></span>
          <button class="btn btn-ghost btn-sm" type="button" id="fbReset" disabled>필터 초기화</button>
        </div>
      </div>
    </div>
    <!-- 슬롯: 표. 명목 열(날짜·코드·이름)은 좌측, 양적 열(금액·개수·%)은 .r 우측. 단위는 헤더로: 평가금액(원).
         열이 5개를 넘으면 .table-cards를 붙여 640px 이하에서 카드형으로 -->
    <div class="table-wrap" tabindex="0" role="region" aria-labelledby="tableTitle">
      <table class="table holdings table-cards">
        <thead><tr><th>이름</th><th>구분</th><th class="r">값</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">
      <p>아직 데이터가 없어요.</p>
      <button class="btn btn-secondary btn-sm" type="button">데이터 연결</button>
    </div>
  </section>
</main>

<script>
  // ---------- 테마 (새로고침 후 유지) ----------
  const root = document.documentElement, themeBtn = document.getElementById("theme");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch {}
  const syncTheme = () => themeBtn.setAttribute("aria-label", isDark() ? "라이트 모드로 보기" : "다크 모드로 보기");
  themeBtn.onclick = () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("theme", root.dataset.theme); } catch {} syncTheme(); };
  syncTheme();

  // ---------- 햄버거 ----------
  const hb = document.getElementById("hamburger"), mm = document.getElementById("mMenu");
  hb.onclick = () => { const o = hb.getAttribute("aria-expanded") !== "true"; hb.setAttribute("aria-expanded", o); hb.setAttribute("aria-label", o ? "메뉴 닫기" : "메뉴 열기"); mm.hidden = !o; };

  // ---------- 드롭다운 (components.html과 같은 규약) ----------
  document.querySelectorAll("[data-menu]").forEach(wrap => {
    const btn = wrap.querySelector("[aria-haspopup]"), menu = wrap.querySelector('[role="menu"]');
    const items = () => [...menu.querySelectorAll('[role="menuitem"]')];
    const open = i => { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); items().at(i).focus(); };
    const close = (re = true) => { if (menu.hidden) return; menu.hidden = true; btn.setAttribute("aria-expanded", "false"); if (re) btn.focus(); };
    btn.onclick = () => menu.hidden ? open(0) : close();
    btn.onkeydown = e => { if (e.key === "ArrowDown") { e.preventDefault(); open(0); } if (e.key === "ArrowUp") { e.preventDefault(); open(-1); } };
    menu.onkeydown = e => {
      const l = items(), i = l.indexOf(document.activeElement), go = n => { e.preventDefault(); l[(n + l.length) % l.length].focus(); };
      if (e.key === "ArrowDown") go(i + 1); else if (e.key === "ArrowUp") go(i - 1);
      else if (e.key === "Home") go(0); else if (e.key === "End") go(l.length - 1);
      else if (e.key === "Escape") { e.preventDefault(); close(); } else if (e.key === "Tab") close(false);
    };
    menu.onclick = e => { if (e.target.closest('[role="menuitem"]')) close(); };
    document.addEventListener("pointerdown", e => { if (!wrap.contains(e.target)) close(false); });
  });

  // 카드형 표 라벨
  document.querySelectorAll(".table-cards").forEach(tb => {
    const heads = [...tb.querySelectorAll("thead th")].map(th => th.textContent);
    tb.querySelectorAll("tbody tr, tfoot tr").forEach(tr => [...tr.children].forEach((td, i) => td.dataset.label = heads[i]));
  });

  // 슬롯: 필터·차트 그리기. 동작 예시는 vault/patterns/dashboard.html
  const rows = document.querySelectorAll("#rows tr");
  document.querySelector(".table-wrap").hidden = !rows.length;
  document.getElementById("empty").hidden = !!rows.length;
</script>
</body>
</html>
