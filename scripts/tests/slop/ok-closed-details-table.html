<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닫힌 표 보기</title>
<link rel="stylesheet" href="../../../vault/tokens.css">
<style>
  main { max-width: 68ch; margin: 0 auto; padding: var(--sp-8) var(--sp-4); display: grid; gap: var(--sp-6); }
  figcaption { font-size: var(--fs-xs); color: var(--text-3); border-top: 1px solid var(--border); padding-top: var(--sp-2); }
  .table-wrap { overflow-x: auto; max-height: 320px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; } th, td { padding: var(--sp-2) var(--sp-3); text-align: right; }
  th { position: sticky; top: 0; background: var(--bg); }
</style>
</head>
<body>
<main>
<h1>닫힌 표 보기</h1>
<figure>
  <p>머리 행을 고정한(sticky) 표를 닫힌 details 안에 둔다. 그림 아래 표는 접어 두고 필요할 때 연다.</p>
  <details><summary>표로 보기</summary><div class="table-wrap">
    <table><thead><tr><th>월</th><th>관세 효과</th><th>에너지 효과</th></tr></thead>
    <tbody><tr><td>2026.09</td><td>0.45</td><td>0.10</td></tr><tr><td>2026.10</td><td>0.40</td><td>0.12</td></tr></tbody></table></div>
  </details>
  <figcaption>출처: 설명용 가상 예시</figcaption>
</figure>
</main>
</body>
</html>
